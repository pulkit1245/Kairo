# Helm values for prometheus-community/prometheus 29.37.2, read by
# infra/terraform/monitoring.tf, which fills in the retention (FR-43).

server:
  retention: "${retention}"
  # 1 day of data isn't worth a volume. emptyDir also means terraform destroy
  # leaves no PersistentVolumeClaims behind
  persistentVolume:
    enabled: false
  global:
    # tighter than the chart's 1m so alerts and the dashboard react in seconds
    scrape_interval: 15s
    scrape_timeout: 10s
    evaluation_interval: 15s
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Keep only what Kairo reads: kubelet resource metrics (pod CPU and memory),
# kube-state-metrics (restarts, OOMKilled, replicas) and Traefik (requests)
scrapeConfigs:
  kubernetes-api-servers:
    enabled: false
  # On Docker Desktop (Docker engine runtime) kubelet's cAdvisor endpoint only
  # labels series by cgroup path, with no pod/namespace/container, so it is
  # useless for per-app CPU and memory. Turned off; see the job below.
  kubernetes-nodes-cadvisor:
    enabled: false
  # kubelet's resource metrics endpoint has the same metric names
  # (container_memory_working_set_bytes, container_cpu_usage_seconds_total,
  # pod_*) with proper namespace/pod/container labels
  kubernetes-nodes-resource:
    enabled: true
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    metrics_path: /metrics/resource
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - source_labels: [__metrics_path__]
        target_label: metrics_path
  kubernetes-service-endpoints-slow:
    enabled: false
  kubernetes-pods-slow:
    enabled: false
  kubernetes-services:
    enabled: false
  prometheus-pushgateway:
    enabled: false

prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
